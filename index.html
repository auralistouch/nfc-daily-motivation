<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Daily Surprise</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        #daily-view {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #loader {
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="daily-view">
        <div id="loader">加载心语中...</div>
    </div>

    <script>
        // 1. 获取 ID 并计算偏移
        const urlParams = new URLSearchParams(window.location.search);
        let deviceId = urlParams.get('id') || 'default';
        let idNumber = 0;
        for (let i = 0; i < deviceId.length; i++) idNumber += deviceId.charCodeAt(i);

        // 2. 获取当天日期
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        
        // 3. 计算图片编号 (1-30)
        const totalItems = 30; 
        const currentId = ((dayOfYear + idNumber) % totalItems) + 1;
        
        // 添加时间戳 v=? 强制避开浏览器缓存问题
        const imgUrl = 'images/' + currentId + '.jpg?v=' + Date.now();

        // 4. 加载图片
        const view = document.getElementById('daily-view');
        const img = new Image();
        img.src = imgUrl;
        
        img.onload = function() {
            view.style.backgroundImage = 'url("' + imgUrl + '")';
            document.getElementById('loader').style.display = 'none';
        };

        img.onerror = function() {
            document.getElementById('loader').innerText = "加载失败，请重试";
        };
    </script>
</body>
</html>

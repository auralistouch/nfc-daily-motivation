<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />
  <title>Auralis Touch</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100vh;
    }

    #dailyImage {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <img id="dailyImage" alt="Daily Image" />

  <script>
    const totalImages = 30;

    // 读取网址中的手链ID，例如 ?id=A001
    const params = new URLSearchParams(window.location.search);
    const braceletId = params.get("id") || "DEFAULT";

    // 获取今天日期，格式例如 20260313
    const today = new Date();
    const dateString =
      today.getFullYear().toString() +
      String(today.getMonth() + 1).padStart(2, "0") +
      String(today.getDate()).padStart(2, "0");

    // 把字符串转成稳定数字
    function stringToNumber(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
      }
      return hash;
    }

    // 根据 手链ID + 日期 生成当天固定图片编号
    const seed = stringToNumber(braceletId + dateString);
    const imageNumber = (seed % totalImages) + 1;

    // 图片路径
    const imagePath = "images/" + imageNumber + ".jpg";

    // 自动防缓存：给图片地址加时间戳
    document.getElementById("dailyImage").src =
      imagePath + "?v=" + Date.now();
  </script>
</body>
</html>

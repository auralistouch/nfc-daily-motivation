<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    
    <title>Daily Surprise</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000;
        }
        #display-img {
            width: 100vw; height: 100vh;
            object-fit: contain; /* 保证图片完整显示，不裁剪 */
            display: none;       /* 图片加载完前隐藏 */
        }
        #loader {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-family: sans-serif; font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="loader">加载中...</div>
    <img id="display-img" alt="Daily Image">

    <script>
        // 1. 计算今日图片编号
        const urlParams = new URLSearchParams(window.location.search);
        let deviceId = urlParams.get('id') || 'default';
        let idNumber = 0;
        for (let i = 0; i < deviceId.length; i++) idNumber += deviceId.charCodeAt(i);

        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        const currentId = ((dayOfYear + idNumber) % 30) + 1;
        
        // 2. 核心优化：使用 jsDelivr CDN 加速图片读取
        // 注意：请修改下方 repoPath 为你的实际路径，例如 '你的用户名/你的仓库名'
        const repoPath = 'auralistouch/nfc-daily-motivation'; 
        const imgUrl = `https://cdn.jsdelivr.net/gh/${repoPath}/images/${currentId}.jpg`;

        // 3. 加载逻辑
        const img = document.getElementById('display-img');
        const loader = document.getElementById('loader');
        
        img.onload = () => {
            img.style.display = 'block';
            loader.style.display = 'none';
        };
        img.onerror = () => {
            loader.innerText = "图片加载失败，请检查路径";
        };
        img.src = imgUrl;
    </script>
</body>
</html>

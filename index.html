<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Surprise</title>
    <style>
        /* 强制全屏无边距 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        /* 背景图片铺满逻辑 */
        #daily-view {
            width: 100vw;
            height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 加载提示文字 */
        #loader {
            color: rgba(255, 255, 255, 0.5);
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="daily-view">
        <div id="loader">加载心语中...</div>
    </div>

    <script>
        // 1. 核心逻辑：计算今日图片编号
        const urlParams = new URLSearchParams(window.location.search);
        let deviceId = urlParams.get('id') || 'default';
        let idNumber = 0;
        for (let i = 0; i < deviceId.length; i++) idNumber += deviceId.charCodeAt(i);

        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        
        const totalItems = 30; // 以后扩展到 365
        const currentId = ((dayOfYear + idNumber) % totalItems) + 1;
        const imgUrl = 'images/' + currentId + '.jpg';

        // 2. 预加载图片并显示
        const view = document.getElementById('daily-view');
        const img = new Image();
        img.src = imgUrl;
        
        img.onload = function() {
            view.style.backgroundImage = 'url("' + imgUrl + '")';
            document.getElementById('loader').style.display = 'none';
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily Surprise</title>
    <style>
        /* 1. 消除边距，让背景铺满 */
        margin: 0;
        padding: 0;
        overflow: hidden; /* 防止滚动条出现 */
        background-color: #000; /* 图片未加载出时显示黑色背景 */
        height: 100vh;
        width: 100vw;
    }

    /* 2. 图片全屏铺满设置 */
    #daily-image {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover; /* 核心：保持比例并填满屏幕，类似于手机壁纸效果 */
        display: block;
    }

    /* 3. 隐藏不需要的文字区域 */
    #debug-info, #daily-text {
        display: none;
    }
</style>
</head>
<body>

    <img id="daily-image" src="" alt="">

    <script>
        // 获取 URL 里的 ID 参数（例如 ?id=A001）
        const urlParams = new URLSearchParams(window.location.search);
        let deviceId = urlParams.get('id') || 'default';

        // 将 ID 转为数字，用于计算偏移
        let idNumber = 0;
        for (let i = 0; i < deviceId.length; i++) {
            idNumber += deviceId.charCodeAt(i);
        }

        // 获取日期
        const now = new Date();
        const dateSeed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

        // 计算逻辑：(日期 + ID数字) 模 30
        const totalImages = 30;
        const currentId = ((dateSeed + idNumber) % totalImages) + 1;

        // 设置图片路径
        document.getElementById('daily-image').src = 'images/' + currentId + '.jpg';
    </script>
</body>
</html>

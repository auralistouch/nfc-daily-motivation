<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Daily</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:black;
overflow:hidden;
}

#dailyImage{
width:100vw;
height:100vh;
object-fit:cover;
}

</style>

</head>

<body>

<img id="dailyImage">

<script>

const totalImages = 30;

// 获取ID
const params = new URLSearchParams(window.location.search);
const braceletId = params.get("id") || "A000";

// 提取编号
const idNumber = parseInt(braceletId.replace(/\D/g,'')) || 0;

// 获取今天日期
const today = new Date();
const daySeed =
today.getFullYear()*10000 +
(today.getMonth()+1)*100 +
today.getDate();

// 更稳定算法
const imageNumber =
((idNumber * 17 + daySeed * 13) % totalImages) + 1;

const imagePath = "images/" + imageNumber + ".jpg";

// 防缓存
document.getElementById("dailyImage").src =
imagePath + "?v=" + Date.now();

</script>

</body>
</html>

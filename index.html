<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Auralis Touch</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    #dailyImage {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
      background: black;
    }
  </style>
</head>
<body>
  <img id="dailyImage" alt="Daily Image" fetchpriority="high" />

  <script>
    const totalImages = 30;

    // 读取网址里的手链ID，例如 ?id=A001
    const params = new URLSearchParams(window.location.search);
    const braceletId = params.get("id") || "A000";

    // 提取数字部分，例如 A001 -> 1，A002 -> 2
    const idNumber = parseInt(braceletId.replace(/\D/g, ""), 10) || 0;

    // 计算今天是一年中的第几天
    const today = new Date();
    const startOfYear = new Date(today.getFullYear(), 0, 0);
    const diff = today - startOfYear;
    const oneDay = 1000 * 60 * 60 * 24;
    const dayOfYear = Math.floor(diff / oneDay);

    // 正式版算法
    // 同一天：A001、A002、A003 会尽量显示不同图片
    // 第二天：会自动整体往后轮换
    const imageNumber = ((idNumber + dayOfYear - 1) % totalImages) + 1;

    // 直接显示图片
    document.getElementById("dailyImage").src = "images/" + imageNumber + ".jpg";
  </script>
</body>
</html>

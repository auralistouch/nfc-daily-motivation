<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Auralis Touch</title>

<style>

html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:black;
overflow:hidden;
}

#dailyImage{
width:100vw;
height:100vh;
object-fit:cover;
display:block;
opacity:0;
transition:opacity 0.3s ease;
}

</style>

</head>

<body>

<img id="dailyImage">

<script>

const totalImages = 30;

// 读取手链ID
const params = new URLSearchParams(window.location.search);
const braceletId = params.get("id") || "A000";

// 提取编号数字
const idNumber = parseInt(braceletId.replace(/\D/g,'')) || 0;

// 获取今天日期
const today = new Date();
const startOfYear = new Date(today.getFullYear(),0,0);
const diff = today - startOfYear;
const oneDay = 1000*60*60*24;
const dayOfYear = Math.floor(diff/oneDay);

// 算法（稳定且分布均匀）
const imageNumber = ((idNumber * 17 + dayOfYear * 13) % totalImages) + 1;

const imagePath = "images/" + imageNumber + ".jpg";

// 预加载图片（加快显示）
const img = new Image();

img.src = imagePath + "?v=" + Date.now();

img.onload = function(){

const displayImg = document.getElementById("dailyImage");

displayImg.src = img.src;

displayImg.style.opacity = 1;

};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Daily</title>

<style>
html,body{
margin:0;
padding:0;
width:100%;
height:100%;
background:black;
}

img{
width:100vw;
height:100vh;
object-fit:cover;
display:block;
}
</style>
</head>

<body>

<img id="dailyImage">

<script>

const totalImages = 30;

const params = new URLSearchParams(window.location.search);
const braceletId = params.get("id") || "A000";

const idNumber = parseInt(braceletId.replace(/\D/g,'')) || 0;

const today = new Date();
const startOfYear = new Date(today.getFullYear(),0,0);
const diff = today - startOfYear;
const oneDay = 1000*60*60*24;
const dayOfYear = Math.floor(diff/oneDay);

const imageNumber = ((idNumber + dayOfYear - 1) % totalImages) + 1;

document.getElementById("dailyImage").src =
"images/" + imageNumber + ".jpg";

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Auralis Touch</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      width: 100vw;
      height: 100vh;
    }

    #dailyImage {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #debug {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      color: white;
      font-size: 16px;
      font-family: Arial, sans-serif;
      background: rgba(0,0,0,0.4);
      padding: 6px 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="debug"></div>
  <img id="dailyImage" alt="Daily Image" />

  <script>
    const totalImages = 30;

    const params = new URLSearchParams(window.location.search);
    const braceletId = params.get("id") || "DEFAULT";

    const today = new Date();
    const dateString =
      today.getFullYear().toString() +
      String(today.getMonth() + 1).padStart(2, "0") +
      String(today.getDate()).padStart(2, "0");

    function stringToNumber(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) % 1000000007;
      }
      return hash;
    }

    const seed = stringToNumber(braceletId + dateString);
    const imageNumber = (seed % totalImages) + 1;
    const imagePath = "images/" + imageNumber + ".jpg";

    document.getElementById("dailyImage").src = imagePath;
    document.getElementById("debug").innerText =
      "ID: " + braceletId + " | Image: " + imageNumber;
  </script>
</body>
</html>

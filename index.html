<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    img {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      display: block;
    }

    #loading {
      position: fixed;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="loading">Loading...</div>
  <img id="dailyImage" alt="Daily Image" style="display:none;" />

  <script>
    const totalImages = 30;

    const today = new Date();
    const dateSeed =
      today.getFullYear() * 10000 +
      (today.getMonth() + 1) * 100 +
      today.getDate();

    const userSeed = Math.floor(Math.random() * 1000000);
    const randomNumber = ((dateSeed + userSeed) % totalImages) + 1;

    const imagePath = "images/" + randomNumber + ".jpg";

    const img = document.getElementById("dailyImage");
    const loading = document.getElementById("loading");

    const preloader = new Image();
    preloader.src = imagePath;

    preloader.onload = function () {
      img.src = imagePath;
      img.style.display = "block";
      loading.style.display = "none";
    };

    preloader.onerror = function () {
      loading.innerText = "Image failed to load";
    };
  </script>
</body>
</html>
